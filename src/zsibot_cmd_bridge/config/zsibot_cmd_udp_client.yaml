# DEPRECATED / OPT-IN ONLY.
# Do not run this forwarder alongside the product-level unified robot bridge.
omni_zsibot_cmd_udp_client:
  ros__parameters:
    # The launch opt-in overrides this to true. Direct ros2 run stays disabled.
    enable_deprecated_transport: false
    proxy_ip: "192.168.234.1"
    proxy_port: 44000
    publish_rate: 50.0
    cmd_timeout: 0.3
    max_vx: 0.3
    max_vy: 0.15
    max_yaw_rate: 0.5
    deadband_vx: 0.05
    deadband_vy: 0.10
    # SDK 仅接受 0 或 |yaw_rate| >= 0.1；小于 0.1 的命令直接归零，禁止向上放大。
    deadband_yaw_rate: 0.10
    status_log_period: 2.0
